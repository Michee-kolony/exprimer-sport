<div class="min-h-screen w-full bg-cover bg-center flex items-center justify-center px-4 py-32 relative"
     style="background-image: url('images/bg.jpg');">

  <!-- OVERLAY FIXÉ CORRECTEMENT -->
  <div class="absolute inset-0 bg-black/60 z-0"></div>

  <!-- CONTENT -->
  <div class="relative z-10 w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-10 items-center">

    <!-- IMAGE -->
    <div class="hidden md:block">
    </div>

    <!-- FORM GLASS CARD -->
    <div class="backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl rounded-2xl p-8 text-white">

      <h2 class="text-3xl font-bold mb-2">
        Contactez-nous
      </h2>

      <p class="text-white/70 mb-6">
        Remplissez le formulaire et nous vous répondrons rapidement.
      </p>

      <form class="space-y-5">

        <!-- NOM / PRENOM -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <input type="text" placeholder="Nom"
            class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400" />

          <input type="text" placeholder="Prénom"
            class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400" />

        </div>

        <!-- TELEPHONE -->
        <input type="tel" placeholder="Téléphone"
          class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- EMAIL -->
        <input type="email" placeholder="Email"
          class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- MESSAGE -->
        <textarea rows="5" placeholder="Votre message..."
          class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>

        <!-- BUTTON -->
        <button type="submit"
          class="w-full bg-[#161F4A] hover:bg-blue-700 transition py-3 rounded-lg font-semibold">
          Envoyer le message
        </button>

      </form>

    </div>

  </div>

</div>
