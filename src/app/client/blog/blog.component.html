<div class="min-h-screen bg-gray-50 px-4 md:px-10 py-32">

  <!-- HEADER -->
  <div class="max-w-6xl mx-auto mb-10">
    <h1 class="text-3xl md:text-5xl font-bold text-gray-800 mb-4">
      Blog & Actualités
    </h1>

    <p class="text-gray-500 text-lg">
      Découvrez les dernières tendances, conseils et articles.
    </p>

    <!-- SEARCH BAR -->
    <div class="mt-6 relative">
      <input
        id="searchBar"
        [(ngModel)]="searchText"
        name="searchText"
        type="text"
        placeholder="Rechercher un article..."
        class="search-input w-full md:w-96 px-5 py-3 rounded-full border border-gray-300 outline-none transition-all duration-500 shadow-sm"
      />

      <i class="fa-solid fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>
  </div>

  <!-- BLOG LIST -->
  <div class="max-w-6xl mx-auto space-y-12">

    <div *ngFor="let article of filteredArticles"
         class="border-b pb-8 flex flex-col md:flex-row gap-6 hover:scale-[1.01] transition">

      <!-- IMAGE -->
      <div class="md:w-1/3 overflow-hidden rounded-xl">
        <img [src]="article.image"
             class="w-full h-60 object-cover hover:scale-110 transition duration-500">
      </div>

      <!-- CONTENT -->
      <div class="md:w-2/3 flex flex-col justify-between">

        <div>
          <span class="text-sm text-blue-800 font-semibold">
            {{ article.category }}
          </span>

          <h2 class="text-2xl font-bold text-gray-800 mt-2 cursor-pointer hover:text-blue-900 transition">
            {{ article.title }}
          </h2>

          <p class="text-gray-500 mt-3 leading-relaxed">
            {{ article.description }}
          </p>
        </div>

        <div class="flex items-center justify-between mt-4 text-sm text-gray-400">
          <span>Par {{ article.author }}</span>
          <span>{{ article.date }}</span>
        </div>

      </div>

    </div>

  </div>

</div>
